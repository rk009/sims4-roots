[package]
name = "sims4-roots"
version = "0.1.0"
description = "A family tree for your Sims"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
strip = true
lto = false
codegen-units = 16
incremental = true
opt-level = "s"
